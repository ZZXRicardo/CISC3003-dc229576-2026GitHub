<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CISC3003 - Practice 06</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="title">
    <h1>Shopping Cart</h1>
</div>
<table class="table-fill">
    <thead>
        <tr>
            <th colspan="2">Product</th>
            <th>#</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
        <script src="js/data.js"></script>
        <script src="js/functions.js"></script>
        <script src="js/cisc3003-practice06.js"></script>
        
        <tr class="totals">
            <td colspan="4">Subtotal</td>
            <td>$<script>document.write(subtotal.toFixed(2));</script></td>
        </tr>
        <tr class="totals">
            <td colspan="4">Tax</td>
            <td>$<script>
                var tax = subtotal * 0.10;
                document.write(tax.toFixed(2));
            </script></td>
        </tr>
        <tr class="totals">
            <td colspan="4">Shipping</td>
            <td>$<script>
                var shipping = subtotal > 1000 ? 0 : 40;
                document.write(shipping.toFixed(2));
            </script></td>
        </tr>
        <tr class="totals focus">
            <td colspan="4">Grand Total</td>
            <td>$<script>
                var grandTotal = subtotal + tax + shipping;
                document.write(grandTotal.toFixed(2));
            </script></td>
        </tr>
    </tbody>
</table>
</body>
</html>
